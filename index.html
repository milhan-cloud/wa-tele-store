<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WA Store</title>
  <meta name="theme-color" content="#0a1224" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="WA Store" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon-192.png" type="image/png" />
  <link rel="apple-touch-icon" href="icon-192.png" />

  <meta name="description" content="Toko online pesan lewat WhatsApp dan Telegram." />
  <style>
/* WA Store — tema premium gelap + emas (mengikuti referensi desain) */
:root {
  --bg: #04103a;
  --bg-2: #0a2a7a;
  --panel: rgba(12, 44, 118, 0.74);
  --panel-solid: #0d2f80;
  --line: rgba(255, 200, 46, 0.5);
  --gold: #ffc52e;
  --gold-2: #ffe27a;
  --gold-deep: #e39a00;
  --text: #f4f8ff;
  --muted: #a9c0ea;
  --ok: #34d399;
  --warn: #fbbf24;
  --danger: #ff7b7b;
  --radius: 18px;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color: var(--text);
  background:
    radial-gradient(900px 500px at 80% -10%, rgba(60,140,255,.35), transparent 60%),
    radial-gradient(800px 420px at -10% 30%, rgba(40,110,255,.25), transparent 60%),
    linear-gradient(180deg, var(--bg-2), var(--bg) 70%);
  background-attachment: fixed;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; text-decoration: none; }
img { max-width: 100%; display: block; }
h1, h2, h3 { font-weight: 800; letter-spacing: -.01em; margin: 0 0 8px; }
h1 { font-size: 34px; }
h2 { font-size: 22px; }
h3 { font-size: 17px; }

/* ---------- topbar ---------- */
.topbar {
  position: sticky; top: 0; z-index: 20;
  display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 12px 22px;
  background: rgba(10, 18, 36, .85);
  border-bottom: 1px solid var(--line);
  backdrop-filter: blur(10px);
}
.brand { display: flex; gap: 10px; align-items: center; font-weight: 800; font-size: 18px; }
.logo {
  display: inline-flex; width: 36px; height: 36px; border-radius: 10px; align-items: center; justify-content: center;
  background: linear-gradient(135deg, var(--gold-2), var(--gold-deep)); color: #1a1408; font-weight: 900;
  box-shadow: 0 6px 18px rgba(231,183,90,.35);
}
.brand em { color: var(--gold); font-style: normal; }
.brand small { color: var(--muted); font-weight: 500; font-size: 12px; margin-left: 8px; }
nav { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
nav a {
  padding: 8px 14px; border-radius: 999px; font-size: 14px; color: var(--text);
  border: 1px solid transparent; transition: .2s;
}
nav a:hover { border-color: var(--line); color: var(--gold-2); }
nav a.active, nav a.btn-gold { background: linear-gradient(135deg, var(--gold-2), var(--gold)); color: #1a1408; font-weight: 700; }
.cart-link span {
  background: var(--gold); color: #1a1408; border-radius: 999px; padding: 0 7px; font-size: 12px; font-weight: 800;
}

main { max-width: 1120px; margin: 0 auto; padding: 28px 18px 70px; min-height: 72vh; }
.footer { text-align: center; color: var(--muted); font-size: 13px; padding: 26px; border-top: 1px solid rgba(212,162,76,.18); }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.error { color: var(--danger); font-weight: 600; }
.ok { color: var(--ok); font-weight: 600; }
.warn { color: var(--warn); font-weight: 600; }

/* ---------- tombol ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border: 0; border-radius: 14px; padding: 12px 20px; font: inherit; font-size: 15px; font-weight: 700;
  background: linear-gradient(135deg, var(--gold-2), var(--gold) 55%, var(--gold-deep));
  color: #1a1408; cursor: pointer; box-shadow: 0 10px 24px rgba(231,183,90,.22); transition: transform .15s, box-shadow .2s;
}
.btn:hover { transform: translateY(-1px); box-shadow: 0 14px 30px rgba(231,183,90,.32); }
.btn.outline { background: transparent; color: var(--gold-2); border: 1.5px solid var(--gold); box-shadow: none; }
.btn.outline:hover { background: rgba(231,183,90,.08); }
.btn.telegram { background: linear-gradient(135deg, #7ab8ff, #3b82f6); color: #fff; }
.btn.small { padding: 8px 14px; font-size: 13px; border-radius: 11px; }
.btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }

/* ---------- hero ---------- */
.hero { display: grid; grid-template-columns: 1.05fr .95fr; gap: 40px; align-items: center; padding: 30px 0 24px; }
.hero h1 { font-size: 52px; line-height: 1.05; margin: 16px 0; }
.hero h1 em { font-style: normal; background: linear-gradient(120deg, var(--gold-2), var(--gold-deep)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.pill {
  display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); color: var(--gold-2);
  border-radius: 999px; padding: 6px 14px; font-size: 13px; background: rgba(231,183,90,.06);
}
.mock {
  background: var(--panel); border: 1px solid var(--line); border-radius: 26px; padding: 20px;
  box-shadow: 0 30px 60px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.04); max-width: 420px; margin-left: auto; width: 100%;
}
.mock-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
.mock-grid div { background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.06); border-radius: 14px; padding: 12px; font-size: 13px; }
.mock-grid b { color: var(--gold-2); }
.steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin: 40px 0 10px; }
.steps > div {
  background: var(--panel); border: 1px solid rgba(212,162,76,.22); border-radius: var(--radius); padding: 18px;
}
.steps b.num {
  display: inline-flex; width: 30px; height: 30px; border-radius: 10px; background: linear-gradient(135deg, var(--gold-2), var(--gold-deep));
  color: #1a1408; align-items: center; justify-content: center; margin-bottom: 10px; font-weight: 900;
}

/* ---------- toko ---------- */
.store-head { display: flex; gap: 16px; align-items: center; margin-bottom: 22px; flex-wrap: wrap; }
.avatar {
  width: 64px; height: 64px; border-radius: 20px; flex-shrink: 0;
  background: linear-gradient(135deg, var(--gold-2), var(--gold-deep)); color: #1a1408;
  display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 20px;
  box-shadow: 0 10px 26px rgba(231,183,90,.3);
}
.store-head h1 { font-size: 30px; margin: 0; }
.actions-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 22px; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 18px; }
.card {
  background: var(--panel); border: 1px solid rgba(212,162,76,.22); border-radius: var(--radius);
  padding: 14px; display: flex; flex-direction: column; gap: 8px; transition: transform .2s, border-color .2s, box-shadow .2s;
}
.card:hover { transform: translateY(-3px); border-color: var(--line); box-shadow: 0 18px 40px rgba(0,0,0,.35); }
.card .thumb {
  aspect-ratio: 1 / 1; width: 100%; border-radius: 14px; object-fit: cover;
  background: radial-gradient(circle at 30% 20%, rgba(231,183,90,.18), rgba(255,255,255,.03) 60%), #0e1830;
}
.card h3 { font-size: 15px; margin: 6px 0 0; }
.price { color: var(--gold-2); font-weight: 800; font-size: 16px; }
.price s { color: var(--muted); font-weight: 400; margin-right: 6px; font-size: 13px; }
.stock { font-size: 12px; color: var(--muted); }
.actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: auto; padding-top: 6px; }

/* ---------- panel / form ---------- */
.panel {
  background: var(--panel); border: 1px solid rgba(212,162,76,.25); border-radius: 22px; padding: 26px;
  box-shadow: 0 24px 50px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.03);
}
.narrow { max-width: 620px; margin: 0 auto; }
.two-col { display: grid; grid-template-columns: 1.2fr 1fr; gap: 22px; align-items: start; }
label { display: block; font-size: 13px; font-weight: 700; margin: 14px 0 6px; color: var(--gold-2); letter-spacing: .02em; }
input, textarea, select {
  width: 100%; padding: 13px 14px; border: 1px solid rgba(212,162,76,.25); border-radius: 13px;
  font: inherit; color: var(--text); background: rgba(5,10,22,.6); outline: none; transition: border-color .2s, box-shadow .2s;
}
input:focus, textarea:focus, select:focus { border-color: var(--gold); box-shadow: 0 0 0 4px rgba(231,183,90,.14); }
textarea { min-height: 84px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 12px; }
.line { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; font-size: 14px; border-bottom: 1px dashed rgba(212,162,76,.18); }
.line.total { font-weight: 800; font-size: 17px; border-bottom: 0; color: var(--gold-2); padding-top: 14px; }
.pre {
  white-space: pre-wrap; background: rgba(5,10,22,.6); border: 1px solid rgba(212,162,76,.2);
  border-radius: 14px; padding: 14px; font-size: 14px; font-family: inherit;
}
.order-no {
  font-family: ui-monospace, Menlo, monospace; font-size: 20px; font-weight: 800; color: var(--gold-2);
  background: rgba(231,183,90,.08); border: 1px dashed var(--gold); border-radius: 14px; padding: 12px 18px; display: inline-block; margin: 10px 0;
}
.center { text-align: center; }

/* ---------- katalog ---------- */
.cat-head { display: flex; gap: 16px; align-items: center; margin-bottom: 8px; }
.cat-icon {
  width: 56px; height: 56px; border-radius: 16px; display: flex; align-items: center; justify-content: center;
  background: linear-gradient(135deg, var(--gold-2), var(--gold-deep)); color: #1a1408; font-size: 26px;
}
.tier {
  display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; margin: 16px 0 6px;
  border-radius: 14px; background: linear-gradient(90deg, rgba(231,183,90,.18), rgba(231,183,90,.02));
  border: 1px solid rgba(231,183,90,.3); color: var(--gold-2); font-weight: 800;
}
.tier span.star { font-size: 12px; font-weight: 700; color: var(--muted); }
.price-row { display: flex; justify-content: space-between; align-items: center; padding: 14px 6px; border-bottom: 1px solid rgba(255,255,255,.06); }
.price-row:last-child { border-bottom: 0; }
.price-row .name { font-weight: 600; }
.price-row .name small { color: var(--muted); font-weight: 500; margin-left: 6px; }
.price-row b { color: var(--gold-2); font-size: 16px; font-variant-numeric: tabular-nums; }

/* ---------- tim agen ---------- */
.team-head { display: flex; gap: 18px; align-items: center; margin-bottom: 24px; }
.team { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 18px; }
.person {
  background: var(--panel); border: 1px solid rgba(212,162,76,.3); border-radius: 22px; padding: 18px;
  display: flex; flex-direction: column; gap: 10px; box-shadow: 0 16px 36px rgba(0,0,0,.3);
}
.person-top { display: flex; gap: 12px; align-items: center; }
.person-top img { width: 72px; height: 72px; border-radius: 18px; flex-shrink: 0; background: #0e1830; }
.person-top b { font-size: 17px; display: block; }
.role {
  display: inline-block; margin-top: 6px; font-size: 12px; font-weight: 800; color: #1a1408;
  background: linear-gradient(135deg, var(--gold-2), var(--gold)); border-radius: 999px; padding: 3px 10px;
}
.status { font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; }
.status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.status.aktif { color: var(--ok); }
.status.menunggu { color: var(--warn); }
.person details { border-top: 1px dashed rgba(212,162,76,.25); padding-top: 10px; }
.person summary {
  cursor: pointer; font-weight: 700; color: var(--gold-2); list-style: none; display: flex; justify-content: space-between; align-items: center;
}
.person summary::-webkit-details-marker { display: none; }
.person summary::after { content: "+"; font-size: 18px; line-height: 1; }
.person details[open] summary::after { content: "−"; }
.person details p { color: var(--muted); font-size: 14px; margin: 10px 0 0; }

/* ---------- responsif ---------- */
@media (max-width: 900px) {
  .hero { grid-template-columns: 1fr; gap: 26px; }
  .hero h1 { font-size: 40px; }
  .mock { margin: 0; max-width: 100%; }
  .steps { grid-template-columns: 1fr 1fr; }
  .two-col { grid-template-columns: 1fr; }
}
@media (max-width: 560px) {
  .topbar { padding: 10px 14px; }
  nav a { padding: 7px 10px; font-size: 13px; }
  main { padding: 20px 12px 56px; }
  h1 { font-size: 26px; }
  .hero h1 { font-size: 32px; }
  .steps { grid-template-columns: 1fr; }
  .grid { grid-template-columns: 1fr 1fr; gap: 12px; }
  .team { grid-template-columns: 1fr; }
  .panel { padding: 18px; }
  .mock-grid { grid-template-columns: 1fr 1fr; }
}

/* ---------- widget agen AI di toko ---------- */
.chat { position: fixed; right: 18px; bottom: 18px; z-index: 50; font-family: inherit; }
.chat-toggle {
  border: 0; border-radius: 999px; padding: 13px 20px; font: inherit; font-weight: 800; cursor: pointer;
  background: linear-gradient(135deg, var(--gold-2), var(--gold) 55%, var(--gold-deep)); color: #1a1408;
  box-shadow: 0 14px 30px rgba(231,183,90,.35);
}
.chat-panel {
  position: absolute; right: 0; bottom: 60px; width: min(360px, calc(100vw - 36px));
  background: #0f1a31; border: 1px solid var(--line); border-radius: 20px; overflow: hidden;
  box-shadow: 0 30px 60px rgba(0,0,0,.55);
}
.chat-panel[hidden] { display: none; }
.chat-head {
  display: flex; justify-content: space-between; align-items: center; padding: 14px 16px;
  background: linear-gradient(90deg, rgba(231,183,90,.22), rgba(231,183,90,.04)); border-bottom: 1px solid var(--line);
}
.chat-x { background: transparent; border: 0; color: var(--gold-2); font-size: 22px; cursor: pointer; line-height: 1; }
.chat-log { max-height: 340px; min-height: 180px; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.bubble { max-width: 86%; padding: 10px 13px; border-radius: 14px; font-size: 14px; white-space: pre-wrap; line-height: 1.45; }
.bubble.bot { background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.07); align-self: flex-start; }
.bubble.me { background: linear-gradient(135deg, var(--gold-2), var(--gold)); color: #1a1408; align-self: flex-end; font-weight: 600; }
.bubble.err { color: var(--danger); }
.chat-form { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--line); }
.chat-form input { padding: 10px 12px; border-radius: 12px; }
.chat-form .btn { padding: 10px 14px; }

/* ---------- dashboard ---------- */
#filters .btn.small.outline { padding: 7px 12px; }
#filters .btn.small.outline:focus, #filters .btn.small.outline:active { background: rgba(231,183,90,.14); }
input[type="checkbox"] { accent-color: var(--gold); width: 18px; height: 18px; }

@media (max-width: 560px) {
  .chat-panel { width: calc(100vw - 28px); right: -4px; }
  .chat { right: 12px; bottom: 12px; }
}

/* ---------- chat: warna hijau WhatsApp ---------- */
.chat-toggle { background: linear-gradient(135deg, #25d366, #128c7e) !important; color: #fff !important; box-shadow: 0 14px 30px rgba(37,211,102,.35) !important; }
.chat-head { background: linear-gradient(90deg, #128c7e, #075e54) !important; border-bottom: 0 !important; }
.chat-head b { color: #fff; }
.chat-x { color: #fff !important; }
.chat-panel { border: 1px solid rgba(37,211,102,.45) !important; background: #0b1a16 !important; }
.bubble.me { background: #dcf8c6 !important; color: #111 !important; }
.chat-form .btn { background: linear-gradient(135deg, #25d366, #128c7e) !important; color: #fff !important; }

/* ---------- katalog: foto produk ---------- */
.pthumb { width: 60px; height: 60px; border-radius: 14px; object-fit: cover; border: 1px solid rgba(231,183,90,.3); flex-shrink: 0; }
.ph {
  width: 60px; height: 60px; border-radius: 14px; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
  font-size: 28px; background: radial-gradient(circle at 30% 20%, rgba(231,183,90,.28), rgba(231,183,90,.05)); border: 1px solid rgba(231,183,90,.3);
}

/* ---------- admin ---------- */
.tbl { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 560px; }
.tbl th { text-align: left; color: var(--gold-2); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; padding: 10px 8px; border-bottom: 1px solid var(--line); }
.tbl td { padding: 11px 8px; border-bottom: 1px dashed rgba(255,255,255,.07); vertical-align: top; }
.mono { font-family: ui-monospace, Menlo, monospace; font-size: 13px; white-space: nowrap; }
.tag { display: inline-block; font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 999px; }
.tag.ok { background: rgba(67,214,138,.14); color: var(--ok); }
.tag.used { background: rgba(255,123,123,.12); color: var(--danger); }

/* ---------- pilihan kurir & pembayaran ---------- */
.pick {
  display: flex; justify-content: space-between; align-items: center; gap: 12px; margin: 8px 0 !important;
  padding: 12px 14px; border: 1px solid rgba(212,162,76,.25); border-radius: 14px; background: rgba(5,10,22,.5);
  font-weight: 600; color: var(--text); cursor: pointer;
}
.pick:has(input:checked) { border-color: var(--gold); background: rgba(231,183,90,.08); }
.pick input { width: 18px; height: 18px; margin: 0; accent-color: var(--gold); flex-shrink: 0; }
.pick span { flex: 1; }
.pick b { color: var(--gold-2); }


/* ---------- chat agen di dashboard & kotak chat WhatsApp (hijau) ---------- */
.agLog { max-height: 340px; min-height: 160px; overflow-y: auto; margin-top: 12px; padding: 12px; display: flex; flex-direction: column; gap: 10px;
  border: 1px solid rgba(37,211,102,.35); border-radius: 14px; background: #0b1a16; }
.agForm { display: flex; gap: 8px; margin-top: 12px; }
.agForm input { flex: 1; }
.agForm .btn { background: linear-gradient(135deg, #25d366, #128c7e) !important; color: #fff !important; }
.chat-panel, .chat-log, .bubble.bot { border-color: rgba(37,211,102,.35) !important; }
.chat-form input:focus, .agForm input:focus { border-color: #25d366 !important; box-shadow: 0 0 0 4px rgba(37,211,102,.18) !important; }
.chat-toggle, .chat-form .btn, .agForm .btn { background: linear-gradient(135deg, #25d366, #128c7e) !important; color: #fff !important; }

/* ---------- pencarian kecamatan checkout ---------- */
.areas { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
.area { text-align: left; background: rgba(5,10,22,.6); border: 1px solid rgba(212,162,76,.25); color: var(--text); border-radius: 12px; padding: 10px 12px; font: inherit; cursor: pointer; }
.area:hover { border-color: var(--gold); color: var(--gold-2); }

/* ---------- katalog premium (sesuai referensi) ---------- */
.cathead { display: grid; grid-template-columns: 0.9fr 1.3fr; gap: 28px; align-items: center; padding: 8px 0 18px; }
.catart { width: 100%; max-width: 300px; display: block; margin: 0 auto; filter: drop-shadow(0 16px 30px rgba(231,183,90,.18)); }
.cattitle { font-size: 40px; line-height: 1.1; margin: 0 0 10px; }
.cattitle span { background: linear-gradient(120deg, var(--gold-2), var(--gold-deep)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.catform label { margin-top: 18px; }
.pwwrap { position: relative; display: flex; align-items: center; }
.pwwrap input { padding-left: 46px; padding-right: 48px; }
.pwlock, .pweye { position: absolute; display: flex; align-items: center; color: var(--gold-2); }
.pwlock { left: 14px; pointer-events: none; }
.pweye { right: 10px; background: transparent; border: 0; cursor: pointer; padding: 6px; }
.catbtn { display: inline-flex; gap: 8px; align-items: center; }
.catbtn.outline { color: var(--gold-2); }
.catlist { padding: 0; overflow: hidden; }
.tierbar {
  display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 16px 22px; background: linear-gradient(90deg, rgba(231,183,90,.16), rgba(231,183,90,.02));
  border-bottom: 1px solid rgba(231,183,90,.3);
}
.tierl { display: inline-flex; gap: 10px; align-items: center; font-weight: 800; color: var(--gold-2); font-size: 18px; }
.tierr { display: inline-flex; gap: 8px; align-items: center; font-size: 13px; font-weight: 700; color: #1a1408;
  background: linear-gradient(135deg, var(--gold-2), var(--gold)); padding: 6px 12px; border-radius: 999px; }
.prow { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 22px; border-bottom: 1px solid rgba(255,255,255,.06); }
.prow:last-child { border-bottom: 0; }
.pleft { display: flex; gap: 14px; align-items: center; min-width: 0; }
.pname { font-weight: 600; font-size: 16px; }
.pname small { color: var(--muted); font-weight: 500; margin-left: 6px; }
.pprice { color: var(--gold-2); font-size: 17px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.catfoot { display: flex; gap: 10px; align-items: center; justify-content: center; color: var(--gold-2); font-size: 14px; margin: 26px 0 0; flex-wrap: wrap; text-align: center; }
@media (max-width: 760px) {
  .cathead { grid-template-columns: 1fr; gap: 14px; }
  .catart { max-width: 180px; }
  .cattitle { font-size: 28px; }
  .prow { padding: 12px 14px; }
  .pprice { font-size: 15px; }

/* ---------- tombol WhatsApp, kartu agen klik, modal ---------- */

async function renderCheckout(slug) {
  const items = getCart().filter((i) => i.slug === slug);
  if (items.length === 0) return setView(`<div class="panel"><h2>Keranjang kosong</h2><a class="btn" href="#/toko/${esc(slug)}">Kembali ke toko</a></div>`);
  const store = await getStore(slug);

  const methods = (Array.isArray(store.payment_methods) ? store.payment_methods : []).filter((m) => m && m.label);
  const subtotal = items.reduce((a, i) => a + i.price * i.qty, 0);
  const FN = `${SUPABASE_URL}/functions/v1/checkout-shipping`;
  const post = (payload) => fetch(FN, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) }).then((r) => r.json().catch(() => ({ ok: false, error: "Gagal terhubung." })));
  let dest = { id: "", name: "" };
  let options = [];

  setView(`
    <div class="two-col">
      <form class="panel" id="co">
        <h2>Data pembeli</h2>
        <label>Nama lengkap *</label><input name="name" required />
        <label>Nomor WhatsApp / telepon *</label><input name="phone" required inputmode="tel" placeholder="08xxxxxxxxxx" />
        <label>Alamat lengkap *</label><textarea name="address" required></textarea>
        <label>Kecamatan tujuan * <span class="muted small">(ketik minimal 3 huruf)</span></label>
        <input name="area" autocomplete="off" placeholder="mis. Coblong Bandung" />
        <div id="areas" class="areas"></div>
        <p id="destinfo" class="muted small"></p>

        <h2 style="margin-top:22px">Pengiriman</h2>
        <div id="rates"><p class="muted small">Pilih kecamatan tujuan untuk melihat pilihan kurir dan ongkir.</p></div>

        <h2 style="margin-top:22px">Pembayaran</h2>
        ${methods.length ? ["bank", "ewallet"].map((grp) => {
          const list = methods.filter((m) => (m.type === "ewallet" ? "ewallet" : "bank") === grp);
          if (!list.length) return "";
          return `<p class="muted small" style="margin:12px 0 4px">${grp === "bank" ? "Transfer bank" : "E-wallet"}</p>` + list.map((m, i) => `
          <label class="pick"><input type="radio" name="payment" value="${esc(m.label)}" ${i === 0 && grp === "bank" ? "checked" : ""} />
            <span>${esc(m.label)}${m.account ? `<small class="muted" style="display:block;font-weight:500">${esc(m.account)}</small>` : ""}</span></label>`).join("");
        }).join("")
          : `<p class="muted">Penjual belum mengisi metode pembayaran. Instruksi akan dikirim lewat chat.</p>`}

        <label>Catatan (opsional)</label><textarea name="notes"></textarea>
        <div class="row" style="margin-top:18px"><button class="btn" type="submit" id="send" disabled>Buat pesanan</button></div>
        <p id="msg"></p>
      </form>
      <div class="panel">
        <h2>Ringkasan</h2>
        ${items.map((i) => `<div class="line"><span>${esc(i.name)}${i.variant ? ` (${esc(i.variant)})` : ""} x${i.qty}</span><span>${rp(i.price * i.qty)}</span></div>`).join("")}
        <div class="line total"><span>Subtotal</span><span>${rp(subtotal)}</span></div>
        <div class="line"><span>Ongkir <span id="kurirlabel" class="muted"></span></span><span id="ship">${rp(0)}</span></div>
        <div class="line total"><span>Perkiraan total</span><span id="tot">${rp(subtotal)}</span></div>
        <p class="muted small">Ongkir dihitung otomatis dari berat barang dan alamat tujuan. Total akhir dikonfirmasi sistem.</p>
      </div>
    </div>`);

  const form = document.getElementById("co");
  const refreshSummary = () => {
    const sel = form.querySelector('input[name="courier"]:checked');
    const fee = sel ? Number(sel.dataset.fee) || 0 : 0;
    document.getElementById("ship").textContent = rp(fee);
    document.getElementById("kurirlabel").textContent = sel ? `(${sel.dataset.label})` : "";
    document.getElementById("tot").textContent = rp(subtotal + fee);
    document.getElementById("send").disabled = !sel;
  };

  const drawRates = (data) => {
    options = data.options || [];
    const out = document.getElementById("rates");
    if (!options.length) { out.innerHTML = `<p class="error">Tidak ada kurir yang bisa mengirim ke alamat ini.</p>`; refreshSummary(); return; }
    out.innerHTML = (data.source === "fallback" ? `<p class="muted small">Tarif sementara dari toko.</p>` : "") +
      options.map((o, i) => `
        <label class="pick"><input type="radio" name="courier" value="${esc(o.courier_code)}|${esc(o.service_code)}" data-fee="${Number(o.price) || 0}" data-label="${esc(o.courier_name)} ${esc(o.service_name)}" ${i === 0 ? "checked" : ""} />
          <span>${esc(o.courier_name)} · ${esc(o.service_name)}${o.etd ? `<small class="muted" style="display:block;font-weight:500">estimasi ${esc(o.etd)}</small>` : ""}</span><b>${rp(o.price)}</b></label>`).join("");
    out.querySelectorAll('input[name="courier"]').forEach((r) => r.addEventListener("change", refreshSummary));
    refreshSummary();
  };

  const loadRates = async () => {
    if (!dest.id) return;
    document.getElementById("rates").innerHTML = `<p class="muted small">Menghitung ongkir…</p>`;
    const data = await post({ action: "rates", slug, destination_area_id: dest.id, items: items.map((i) => ({ product_id: i.product_id, variant: i.variant, qty: i.qty, name: i.name })) });
    if (!data.ok) { document.getElementById("rates").innerHTML = `<p class="error">${esc(data.error || "Gagal menghitung ongkir.")}</p>`; return; }
    drawRates(data);
  };

  let timer;
  form.area.addEventListener("input", () => {
    clearTimeout(timer);
    const q = form.area.value.trim();
    timer = setTimeout(async () => {
      if (q.length < 3) { document.getElementById("areas").innerHTML = ""; return; }
      const data = await post({ action: "areas", q });
      const list = (data.areas || []);
      document.getElementById("areas").innerHTML = list.map((a) =>
        `<button type="button" class="area" data-id="${esc(a.id)}" data-name="${esc(a.name)}">${esc(a.name)}</button>`).join("") ||
        `<p class="muted small">Tidak ditemukan. Coba nama kecamatan lain.</p>`;
      document.querySelectorAll("#areas .area").forEach((btn) => btn.addEventListener("click", () => {
        dest = { id: btn.dataset.id, name: btn.dataset.name };
        form.area.value = dest.name;
        document.getElementById("areas").innerHTML = "";
        document.getElementById("destinfo").textContent = `Tujuan: ${dest.name}`;
        loadRates();
      }));
    }, 450);
  });

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const sel = form.querySelector('input[name="courier"]:checked');
    if (!sel || !dest.id) return toast("Pilih kecamatan dan kurir dulu.", "error");
    const btn = document.getElementById("send");
    btn.disabled = true;
    const fd = new FormData(form);
    const [courier_code, service_code] = sel.value.split("|");
    const res = await post({
      action: "order", slug,
      customer_name: fd.get("name"), customer_phone: fd.get("phone"), customer_address: fd.get("address"),
      destination_area_id: dest.id, destination_area_name: dest.name,
      courier_code, service_code, payment_method: fd.get("payment") || null, notes: fd.get("notes") || null,
      items: items.map((i) => ({ product_id: i.product_id, variant: i.variant, qty: i.qty, name: i.name })),
    });
    if (!res.ok) {
      toast(res.error || "Pesanan gagal disimpan. Coba lagi.", "error");
      if (/berubah|hitung ulang/i.test(res.error || "")) loadRates();
      btn.disabled = false;
      return;
    }
    saveCart(getCart().filter((i) => i.slug !== slug));
    location.hash = `#/toko/${slug}/sukses?no=${encodeURIComponent(res.order_number)}&telepon=${encodeURIComponent(fd.get("phone"))}`;
  });
}

function makeOrderNumber() {
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let a = "";
  for (let i = 0; i < 6; i++) a += chars[Math.floor(Math.random() * chars.length)];
  return `WEB-${a}-${String(Math.floor(1000 + Math.random() * 9000))}`;
}

function friendlyOrderError(msg) {
  if (/row-level security/i.test(msg)) return "Toko sedang tidak menerima pesanan.";
  if (/Terlalu banyak pesanan/i.test(msg)) return "Terlalu banyak pesanan dari nomor ini. Coba lagi nanti.";
  if (/Kurir tidak tersedia/i.test(msg)) return "Kurir yang dipilih tidak tersedia. Pilih kurir lain.";
  if (/Terlalu banyak item/i.test(msg)) return "Terlalu banyak item dalam satu pesanan (maksimal 50).";
  return "Pesanan gagal disimpan. Coba lagi atau hubungi toko.";
}

  const store = await getStore(slug);
  out.innerHTML = `

    ${o.payment_proof_url ? `<p class="ok">Bukti transfer sudah dikirim. Penjual akan memverifikasi.</p>` : ""}
    ${canUpload ? `
      <h3>Kirim bukti transfer</h3>
      <p class="muted small">JPG, PNG, atau WEBP, maksimal 5 MB. Batas 3 kali unggah per pesanan.</p>
      <input type="file" id="proof" accept="image/jpeg,image/png,image/webp" />
      <div class="row" style="margin-top:10px"><button class="btn" id="upload">Unggah bukti</button></div>
      <p id="msg"></p>` : ""}
  `;
  if (canUpload) {
    document.getElementById("upload").addEventListener("click", () => uploadProof(store, o, phone));
  }

async function uploadProof(store, o, phone) {
  const file = document.getElementById("proof").files[0];
  if (!file) return toast("Pilih berkas dulu.", "error");
  if (file.size > MAX_PROOF_BYTES) return toast("Ukuran berkas melebihi 5 MB.", "error");
  if (!PROOF_TYPES.includes(file.type)) return toast("Format harus JPG, PNG, atau WEBP.", "error");
  const btn = document.getElementById("upload");
  btn.disabled = true;
  toast("Mengunggah…");
  try {
    const safe = file.name.replace(/[^a-zA-Z0-9._-]/g, "_").slice(-60);
    const path = `${store.id}/${o.order_number}/${Date.now()}-${safe}`;
    const up = await sb.storage.from("payment-proofs").upload(path, file, { upsert: false });
    if (up.error) throw up.error;
    const { error } = await sb.rpc("attach_payment_proof", { p_order_number: o.order_number, p_phone: phone, p_path: path });
    if (error) throw error;
    toast("Bukti transfer berhasil dikirim ke penjual.");
    await sleep(600);
    await showOrder(store.slug, o.order_number, phone);
  } catch (err) {
    toast(err.message || "Gagal mengirim bukti transfer.", "error");
    btn.disabled = false;
  }
}

async function openAgent(p) {
  const { data: sess } = await sb.auth.getSession();
  const isOwner = !!sess.session;
  const action = p.slug === "agen-cs"
    ? `<a class="btn wa" href="#/toko/toko-maju">Coba chat di toko demo</a>`
    : isOwner
      ? `<a class="btn" href="#/dashboard">Chat di dashboard</a>`
      : `<a class="btn outline" href="#/masuk">Masuk untuk chat dengan agen</a>`;
  const ov = document.createElement("div");
  ov.className = "modal";
  ov.innerHTML = `
    <div class="mbox" role="dialog" aria-modal="true">
      <button class="mclose" type="button" aria-label="Tutup">×</button>
      <div class="mhead">

        <div><h2>${esc(p.name)}</h2><span class="role">${esc(p.role)}</span>
          <div><span class="status ${p.status === "aktif" ? "aktif" : "menunggu"}">${p.status === "aktif" ? "Aktif" : "Menunggu aktivasi"}</span></div></div>
      </div>
      <p class="muted">${esc(p.description)}</p>
      <div class="row">${action}</div>
    </div>`;
  const close = () => ov.remove();
  ov.addEventListener("click", (e) => { if (e.target === ov || e.target.classList.contains("mclose")) close(); });
  document.body.appendChild(ov);
  ov.querySelectorAll("a").forEach((x) => x.addEventListener("click", close));
}

/* ---------- akun: username -> email internal, dan pesan galat ramah ---------- */
const toEmail = (u) => { const t = String(u || "").trim().toLowerCase(); return t.includes("@") ? t : t + "@wastore.app"; };
const friendlyAuth = (m) => {
  if (/already registered|already been registered/i.test(m)) return "Username sudah dipakai. Pilih username lain atau masuk.";
  if (/Invalid login credentials/i.test(m)) return "Username atau password salah.";
  if (/Email not confirmed/i.test(m)) return "Akun belum aktif. Hubungi admin.";
  if (/Password should be/i.test(m)) return "Password minimal 8 karakter.";
  return m;
};

function renderMasuk() {
  setView(`
    <div class="panel narrow">
      <h1>Masuk</h1>
      <p class="muted">Masuk dengan username dan password Anda. Pemilik toko dan admin masuk di sini.</p>
      <form id="login" novalidate>
        <label>Username</label><input name="username" autocomplete="username" />
        <label>Password</label><input name="password" type="password" autocomplete="current-password" />
        <div class="row"><button class="btn" type="submit" id="loginbtn">Masuk</button></div>
      </form>
      <p class="muted small">Belum punya toko? <a href="#/daftar" style="color:var(--gold-2)">Daftar dengan kunci lisensi</a></p>
      <p id="msg"></p>
    </div>`);
  const form = document.getElementById("login");
  const btn = document.getElementById("loginbtn");
  const withTimeout = (p) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error("Koneksi lambat. Coba lagi.")), 15000))]);
  const doLogin = async () => {
    const u = form.username.value.trim();
    const pw = form.password.value;
    if (!u || !pw) return toast("Isi username dan password dulu.", "error");
    btn.disabled = true; btn.textContent = "Memproses…";
    try {
      const { error } = await withTimeout(sb.auth.signInWithPassword({ email: toEmail(u), password: pw }));
      if (error) throw new Error(friendlyAuth(error.message));
      const { data: isAdmin } = await withTimeout(sb.rpc("is_platform_admin"));
      toast("Berhasil masuk.");
      location.hash = isAdmin ? "#/admin" : "#/dashboard";
    } catch (err) {
      toast(err.message || "Gagal masuk. Coba lagi.", "error");
    } finally {
      btn.disabled = false; btn.textContent = "Masuk";
    }
  };
  form.addEventListener("submit", (e) => { e.preventDefault(); doLogin(); });
  btn.addEventListener("click", (e) => { e.preventDefault(); doLogin(); });
}

async function renderDaftar() {
  const { data: sess } = await sb.auth.getSession();
  if (sess.session) return renderKlaimToko();
  setView(`
    <div class="panel narrow">
      <h1>Daftar pemilik toko</h1>
      <p class="muted">Buat akun dengan username dan password, lalu masukkan kunci lisensi sekali pakai untuk membuat toko.</p>
      <form id="reg">
        <label>Username</label><input name="username" required minlength="3" pattern="[a-zA-Z0-9._-]+" />
        <label>Password (minimal 8 karakter)</label><input name="password" type="password" required minlength="8" />
        <label>Kunci lisensi</label><input name="code" required placeholder="XXX-XXXX-XXXX-XXXX" />
        <label>Nama toko</label><input name="store" required />
        <label>Alamat toko (huruf, angka, tanda minus)</label><input name="slug" required placeholder="toko-saya" />
        <label>Nomor WhatsApp toko</label><input name="wa" inputmode="tel" />
        <div class="row"><button class="btn" type="submit">Buat toko</button></div>
      </form>
      <p class="muted small">Sudah punya akun? <a href="#/masuk">Masuk</a></p>
      <p id="msg"></p>
    </div>`);
  document.getElementById("reg").addEventListener("submit", async (e) => {
    e.preventDefault();
    const f = e.target;
    const btn = f.querySelector("button"); btn.disabled = true;
    try {
      const email = toEmail(f.username.value);
      const { data, error } = await sb.auth.signUp({ email, password: f.password.value });
      if (error) throw new Error(friendlyAuth(error.message));
      if (!data.session) {
        const r = await sb.auth.signInWithPassword({ email, password: f.password.value });
        if (r.error) throw new Error(friendlyAuth(r.error.message));
      }
      await claimStore(f);
    } catch (err) { toast(err.message, "error"); btn.disabled = false; }
  });
}

async function claimStore(f) {
  const { error } = await sb.rpc("claim_store_license", {
    p_code: f.code.value.trim(), p_store_name: f.store.value.trim(),
    p_slug: f.slug.value.trim(), p_whatsapp: f.wa.value.trim(),
  });
  if (error) throw new Error(error.message);
  toast("Toko berhasil dibuat. Membuka dashboard…");
  await sleep(700);
  location.hash = "#/dashboard";
}

async function pageRingkasan(s) {
  const since = new Date(Date.now() - 7 * 86400000).toISOString();
  const [{ data: orders }, { data: prods }] = await Promise.all([
    sb.from("orders").select("order_number,customer_name,total,status,created_at").eq("store_id", s.id).order("created_at", { ascending: false }).limit(300),
    sb.from("products").select("name,stock,low_stock_threshold,is_active").eq("store_id", s.id),
  ]);
  const O = orders || [];
  const week = O.filter((o) => o.created_at >= since && o.status !== "cancelled");
  const omzet = week.reduce((a, o) => a + Number(o.total || 0), 0);
  const menunggu = O.filter((o) => ["pending", "contacted"].includes(o.status)).length;
  const menipis = (prods || []).filter((p) => p.is_active && p.stock <= p.low_stock_threshold);
  dashPut(`
    <div class="kpis">
      <div class="kpi"><span>Pesanan 7 hari</span><b>${week.length}</b></div>
      <div class="kpi"><span>Omzet 7 hari</span><b>${rp(omzet)}</b></div>

    <div class="panel" style="margin-top:18px"><h2>Pesanan terbaru</h2>
      ${O.slice(0, 6).map((o) => `<div class="line"><span><b>${esc(o.order_number)}</b> · ${esc(o.customer_name)}</span><span>${rp(o.total)} · ${esc(STATUS_LABEL[o.status] || o.status)}</span></div>`).join("") || `<p class="muted">Belum ada pesanan.</p>`}

}

async function agentChatPanel(s) {
  const { data: agents } = await sb.from("agent_team").select("slug,name,role,status").order("sort_order");
  const host = document.getElementById("dashbody");
  if (!host) return;
  host.insertAdjacentHTML("beforeend", `
    <div class="panel" style="margin-top:18px">
      <h2>Chat dengan agen</h2>
      <p class="muted small">Tanyakan langsung ke agen tentang toko Anda. Agen membaca data toko, tetapi tidak mengubah pesanan, harga, atau pengaturan.</p>
      <label>Pilih agen</label>
      <select id="agsel">${(agents || []).map((a) => `<option value="${esc(a.slug)}">${esc(a.name)} · ${esc(a.role)}${a.status !== "aktif" ? " (menunggu aktivasi)" : ""}</option>`).join("")}</select>
      <div id="agLog" class="agLog"><div class="bubble bot">Halo! Silakan tanyakan sesuatu tentang toko Anda.</div></div>
      <form id="agForm" class="agForm">
        <input name="q" placeholder="Tulis pertanyaan…" maxlength="600" required autocomplete="off" />
        <button class="btn small" type="submit">Kirim</button>
      </form>
    </div>`);
  const log = document.getElementById("agLog");
  document.getElementById("agForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const input = e.target.q;
    const q = input.value.trim();
    if (!q) return;
    input.value = "";
    log.insertAdjacentHTML("beforeend", `<div class="bubble me">${esc(q)}</div>`);
    const wait = document.createElement("div");
    wait.className = "bubble bot"; wait.textContent = "Sedang mengetik…";
    log.appendChild(wait); log.scrollTop = log.scrollHeight;
    try {
      const { data: sd } = await sb.auth.getSession();
      const token = sd.session?.access_token || "";
      const res = await fetch(`${SUPABASE_URL}/functions/v1/owner-agent-chat`, {
        method: "POST",
        headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}`, apikey: SUPABASE_KEY },
        body: JSON.stringify({ store_id: s.id, agent: document.getElementById("agsel").value, message: q }),
      });
      const j = await res.json().catch(() => ({}));
      wait.textContent = j.ok ? `${j.agent}: ${j.answer}` : (j.error || "Agen sedang sibuk.");
      wait.className = j.ok ? "bubble bot" : "bubble bot err";
    } catch (_) {
      wait.textContent = "Tidak bisa terhubung ke agen. Coba lagi.";
      wait.className = "bubble bot err";
    }
    log.scrollTop = log.scrollHeight;
  });
}

let editProdId = null;
async function pageProduk(s) {

    .select("id,name,slug,description,price,sale_price,stock,low_stock_threshold,weight_gram,is_active,image_url").eq("store_id", s.id).order("name");
  if (error) return dashPut(`<p class="error">${esc(error.message)}</p>`);
  const P = prods || [];
  const cur = P.find((p) => p.id === editProdId) || {};
  dashPut(`
    <div class="panel">
      <h2>${editProdId ? "Ubah produk" : "Tambah produk"}</h2>
      <form id="pf" class="grid2">
        <div><label>Nama produk *</label><input name="name" required value="${esc(cur.name || "")}" /></div>
        <div><label>Alamat (slug)</label><input name="slug" value="${esc(cur.slug || "")}" placeholder="otomatis dari nama" /></div>
        <div><label>Harga normal (Rp) *</label><input name="price" type="number" min="0" required value="${esc(cur.price ?? "")}" /></div>
        <div><label>Harga promo (Rp)</label><input name="sale_price" type="number" min="0" value="${esc(cur.sale_price ?? "")}" /></div>
        <div><label>Stok</label><input name="stock" type="number" min="0" value="${esc(cur.stock ?? 0)}" /></div>
        <div><label>Berat (gram)</label><input name="weight_gram" type="number" min="1" value="${esc(cur.weight_gram ?? 500)}" /></div>
        <div><label>Batas stok menipis</label><input name="low_stock_threshold" type="number" min="0" value="${esc(cur.low_stock_threshold ?? 5)}" /></div>
        <div class="full">${plusTile("image_url", cur.image_url, "Foto produk")}</div>
        <div class="full"><label>Deskripsi</label><textarea name="description">${esc(cur.description || "")}</textarea></div>
        <label class="pick full"><input type="checkbox" name="is_active" ${cur.is_active === false ? "" : "checked"} /><span>Tampilkan di toko</span></label>
        <div class="row full"><button class="btn" type="submit">${editProdId ? "Simpan perubahan" : "Tambah produk"}</button>
          ${editProdId ? `<button class="btn outline" type="button" id="pcancel">Batal</button>` : ""}</div>
      </form>
      <p id="msgp"></p>
    </div>
    <div class="panel" style="margin-top:18px"><h2>Daftar produk (${P.length})</h2>
      <div style="overflow-x:auto"><table class="tbl"><thead><tr><th>Nama</th><th>Harga</th><th>Stok</th><th>Berat</th><th>Tampil</th><th></th></tr></thead>
      <tbody>${P.map((p) => `<tr><td><div class="pleft">${p.image_url ? `<img class="pthumb" src="${esc(p.image_url)}" alt="" />` : `<span class="ph">${productIcon(p.name)}</span>`}<span>${esc(p.name)}</span></div></td><td>${p.sale_price ? `<s class="muted">${rp(p.price)}</s> ${rp(p.sale_price)}` : rp(p.price)}</td>
        <td class="${p.stock <= p.low_stock_threshold ? "warn" : ""}">${p.stock}</td><td>${p.weight_gram} g</td><td>${p.is_active ? "Ya" : "Tidak"}</td>
        <td><button class="btn small outline" data-edit="${p.id}">Ubah</button> <button class="btn small outline" data-del="${p.id}">Hapus</button></td></tr>`).join("") || `<tr><td colspan="6" class="muted">Belum ada produk.</td></tr>`}</tbody></table></div>
    </div>`);
  const f = document.getElementById("pf");
  wirePlusTiles(f, "products");
  const slugify = (t) => String(t).toLowerCase().trim().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
  f.addEventListener("submit", async (e) => {
    e.preventDefault();
    const x = e.target;
    const row = {
      name: x.name.value.trim(), slug: slugify(x.slug.value || x.name.value),
      description: x.description.value.trim() || null, price: Number(x.price.value),
      sale_price: x.sale_price.value === "" ? null : Number(x.sale_price.value),
      stock: Number(x.stock.value) || 0, low_stock_threshold: Number(x.low_stock_threshold.value) || 0,
      weight_gram: Math.max(1, Number(x.weight_gram.value) || 500), is_active: x.is_active.checked,
      image_url: x.image_url.value || null,
    };
    const q = editProdId
      ? sb.from("products").update(row).eq("id", editProdId).eq("store_id", s.id)
      : sb.from("products").insert({ ...row, store_id: s.id });
    const { error: e2 } = await q;
    if (e2) return (document.getElementById("msgp").innerHTML = `<span class="error">${esc(e2.message)}</span>`);
    editProdId = null;
    pageProduk(s);
  });
  document.getElementById("pcancel")?.addEventListener("click", () => { editProdId = null; pageProduk(s); });
  document.querySelectorAll("[data-edit]").forEach((b) => b.addEventListener("click", () => { editProdId = b.dataset.edit; pageProduk(s); }));
  document.querySelectorAll("[data-del]").forEach((b) => b.addEventListener("click", async () => {
    if (!confirm("Hapus produk ini?")) return;
    const { error: e3 } = await sb.from("products").delete().eq("id", b.dataset.del).eq("store_id", s.id);
    if (e3) return toast(e3.message, "error");
    pageProduk(s);
  }));
}

    return `<div class="row rowm">
      <select name="mtype" class="mtype">
        <option value="bank" ${!isEw ? "selected" : ""}>Bank (transfer)</option>

        <label>Teks banner</label><input name="banner_subtitle" maxlength="160" value="${esc(t?.banner_subtitle || "")}" placeholder="mis. Diskon hingga 30% untuk semua produk" />
        <label>Nama toko *</label><input name="store_name" required value="${esc(t?.name || "")}" />
        <p class="muted small">Alamat link toko tidak ikut berubah. Hanya nama yang tampil di halaman dan dashboard.</p>
        <label>Deskripsi</label><textarea name="description">${esc(t?.description || "")}</textarea>
        <label>Lokasi</label><input name="location" value="${esc(t?.location || "")}" />
        <label>Nomor WhatsApp toko</label><input name="whatsapp_number" value="${esc(t?.whatsapp_number || "")}" />

        <h2 id="sec-asal" style="margin-top:20px">Asal pengiriman (ongkir otomatis)</h2>
        <p class="muted small">Cari kecamatan tempat toko Anda berada. Ongkir dihitung dari sini ke alamat pembeli.</p>
        <input id="oarea" placeholder="Ketik nama kecamatan (min. 3 huruf)" autocomplete="off" />
        <div id="oareas" class="areas"></div>
        <p class="muted small">Asal saat ini: <b id="oname">${esc(t?.origin_area_name || "belum diatur")}</b></p>
        <input type="hidden" name="origin_area_id" value="${esc(t?.origin_area_id || "")}" />
        <input type="hidden" name="origin_area_name" value="${esc(t?.origin_area_name || "")}" />

        <h2 id="sec-ongkir" style="margin-top:20px">Kurir & ongkir tetap (cadangan)</h2>
        <p class="muted small">Dipakai bila layanan ongkir otomatis sedang tidak tersedia.</p>
        <div id="couriers">${couriers.map(rowC).join("")}</div>
        <button type="button" class="btn small outline" id="addc">+ Tambah kurir</button>

        <h2 id="sec-bayar" style="margin-top:20px">Metode pembayaran</h2>
        <div id="methods">${methods.map(rowM).join("")}</div>
        <button type="button" class="btn small outline" id="addm">+ Tambah rekening atau e-wallet</button>
        <label style="margin-top:18px">Catatan pembayaran</label><textarea name="payment_note">${esc(t?.payment_note || "")}</textarea>
        <div class="row"><button class="btn" type="submit">Simpan pengaturan toko</button></div>
        <p id="msgs"></p>
      </form>
    </div>
    <div class="panel" style="margin-top:18px">
      <h2 id="sec-akun">Ganti username</h2>
      <p class="muted small">Username dipakai untuk masuk. Setelah diganti, Anda perlu masuk ulang dengan username baru.</p>
      <form id="unf">
        <label>Username baru (huruf kecil, angka, titik, garis bawah, atau minus; 3 sampai 30 karakter)</label><input name="uname" required minlength="3" maxlength="30" pattern="[a-zA-Z0-9._-]+" />
        <label>Password saat ini (untuk konfirmasi)</label><input name="upw" type="password" required autocomplete="current-password" />
        <div class="row"><button class="btn" type="submit" id="unbtn">Ganti username</button></div>
        <p id="msgun"></p>
      </form>
    </div>
    <div class="panel" style="margin-top:18px">
      <h2>Ganti password</h2>
      <p class="muted small">Masukkan password lama, lalu password baru (minimal 8 karakter) dua kali.</p>
      <form id="pwf">
        <label>Password lama</label><input name="old" type="password" required autocomplete="current-password" />
        <label>Password baru</label><input name="new1" type="password" minlength="8" required autocomplete="new-password" />
        <label>Ulangi password baru</label><input name="new2" type="password" minlength="8" required autocomplete="new-password" />
        <div class="row"><button class="btn" type="submit" id="pwbtn">Ganti password</button></div>
        <p id="msgpw2"></p>

  document.getElementById("addm").onclick = () => { document.getElementById("methods").insertAdjacentHTML("beforeend", rowM()); wire(); };

  let timer;
  document.getElementById("oarea").addEventListener("input", (e) => {
    clearTimeout(timer);
    const q = e.target.value.trim();
    timer = setTimeout(async () => {
      if (q.length < 3) { document.getElementById("oareas").innerHTML = ""; return; }
      const res = await fetch(`${SUPABASE_URL}/functions/v1/checkout-shipping`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ action: "areas", q }) });
      const j = await res.json().catch(() => ({}));
      document.getElementById("oareas").innerHTML = (j.areas || []).map((a) => `<button type="button" class="area" data-id="${esc(a.id)}" data-name="${esc(a.name)}">${esc(a.name)}</button>`).join("") || `<p class="muted small">Tidak ditemukan.</p>`;
      document.querySelectorAll("#oareas .area").forEach((btn) => btn.addEventListener("click", () => {
        const f = document.getElementById("sf");
        f.origin_area_id.value = btn.dataset.id;
        f.origin_area_name.value = btn.dataset.name;
        document.getElementById("oname").textContent = btn.dataset.name;
        document.getElementById("oareas").innerHTML = "";
        document.getElementById("oarea").value = "";
      }));
    }, 450);
  });

  document.getElementById("sf").addEventListener("submit", async (e) => {
    e.preventDefault();
    const f = e.target;
    const cs = [...document.querySelectorAll(".rowc")].map((r) => ({ name: r.querySelector('[name="cname"]').value.trim(), fee: Number(r.querySelector('[name="cfee"]').value) || 0 })).filter((c) => c.name);
    const ms = [...document.querySelectorAll(".rowm")].map((r) => {
      const no = r.querySelector('[name="maccount"]').value.trim();
      const holder = r.querySelector('[name="mholder"]').value.trim();
      return { type: r.querySelector('[name="mtype"]').value, label: r.querySelector('[name="mlabel"]').value, account: no ? (holder ? `${no} a.n. ${holder}` : no) : "" };
    }).filter((m) => m.label && m.account);
    const newName = f.store_name.value.trim();
    if (!newName) return (document.getElementById("msgs").innerHTML = `<span class="error">Nama toko tidak boleh kosong.</span>`);
    const { error: e2 } = await sb.from("stores").update({
      name: newName, logo_url: f.logo_url.value || null, banner_url: f.banner_url.value || null, banner_title: f.banner_title.value.trim() || null, banner_subtitle: f.banner_subtitle.value.trim() || null,
      description: f.description.value.trim() || null, location: f.location.value.trim() || null,
      whatsapp_number: f.whatsapp_number.value.trim() || null, couriers: cs, payment_methods: ms,
      payment_note: f.payment_note.value.trim() || null,
      payment_accounts: ms.map((m) => `${m.label} ${m.account}`).join("\n") || null,
      origin_area_id: f.origin_area_id.value || null, origin_area_name: f.origin_area_name.value || null,
    }).eq("id", s.id);
    document.getElementById("msgs").innerHTML = e2 ? `<span class="error">${esc(e2.message)}</span>` : `<span class="ok">Pengaturan tersimpan.</span>`;
  });

  document.getElementById("unf").addEventListener("submit", async (e) => {
    e.preventDefault();
    const f = e.target;
    const out = document.getElementById("msgun");
    const btn = document.getElementById("unbtn");
    btn.disabled = true;
    try {
      const { data: sd } = await sb.auth.getSession();
      const email = sd.session?.user?.email;
      if (!email) throw new Error("Silakan masuk ulang.");
      const check = await sb.auth.signInWithPassword({ email, password: f.upw.value });
      if (check.error) throw new Error("Password tidak cocok.");
      const token = check.data.session?.access_token || "";
      const res = await fetch(`${SUPABASE_URL}/functions/v1/owner-account`, {
        method: "POST",
        headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}`, apikey: SUPABASE_KEY },
        body: JSON.stringify({ action: "change_username", username: f.uname.value.trim() }),
      });
      const j = await res.json().catch(() => ({}));
      if (!j.ok) throw new Error(j.error || "Gagal mengganti username.");
      await sb.auth.signOut();
      toast("Username diganti. Silakan masuk dengan username baru.");
      location.hash = "#/masuk";
    } catch (err) {
      out.innerHTML = `<span class="error">${esc(err.message || "Gagal mengganti username.")}</span>`;
    } finally {
      btn.disabled = false;
    }
  });

  document.getElementById("pwf").addEventListener("submit", async (e) => {
    e.preventDefault();
    const f = e.target;
    const out = document.getElementById("msgpw2");
    const btn = document.getElementById("pwbtn");
    if (f.new1.value !== f.new2.value) return (out.innerHTML = `<span class="error">Password baru tidak sama.</span>`);
    if (f.new1.value === f.old.value) return (out.innerHTML = `<span class="error">Password baru harus berbeda dari yang lama.</span>`);
    btn.disabled = true;
    try {
      const { data: sd } = await sb.auth.getSession();
      const email = sd.session?.user?.email;
      if (!email) throw new Error("Silakan masuk ulang.");
      // Pastikan password lama benar
      const check = await sb.auth.signInWithPassword({ email, password: f.old.value });
      if (check.error) throw new Error("Password lama tidak cocok.");
      const { error } = await sb.auth.updateUser({ password: f.new1.value });
      if (error) throw new Error(friendlyAuth(error.message));
      out.innerHTML = `<span class="ok">Password berhasil diganti.</span>`;
      f.reset();
    } catch (err) {
      out.innerHTML = `<span class="error">${esc(err.message || "Gagal mengganti password.")}</span>`;
    } finally {
      btn.disabled = false;
    }
  });
}

/* ---------- tombol + untuk unggah gambar (dipakai di produk, reward, dan logo) ---------- */
function plusTile(name, currentUrl, label) {
  return `
    <div class="uptile" data-up="${esc(name)}">
      <input type="hidden" name="${esc(name)}" value="${esc(currentUrl || "")}" />
      <div class="upprev">${currentUrl ? `<img src="${esc(currentUrl)}" alt="" />` : `<span class="plus">+</span>`}</div>
      <div class="upmeta"><b>${esc(label)}</b><span class="muted small">${currentUrl ? "Ketuk untuk ganti gambar" : "Ketuk + untuk pilih gambar"}</span></div>
      <input type="file" accept="image/*" class="upfile" hidden />
      <p class="uperr small"></p>
    </div>`;
}
function wirePlusTiles(root, folder) {
  root.querySelectorAll(".uptile").forEach((tile) => {
    const file = tile.querySelector(".upfile");
    tile.addEventListener("click", (e) => { if (e.target.tagName !== "INPUT") file.click(); });
    file.addEventListener("change", async () => {
      const f = file.files[0];
      if (!f) return;
      const err = tile.querySelector(".uperr");
      if (!f.type.startsWith("image/")) { err.textContent = "Pilih berkas gambar."; return; }
      if (f.size > 5 * 1024 * 1024) { err.textContent = "Ukuran gambar maksimal 5 MB."; return; }
      err.textContent = "Mengunggah…";
      try {
        const { data: sd } = await sb.auth.getSession();
        const uid = sd.session?.user?.id;
        if (!uid) throw new Error("Silakan masuk ulang.");
        const safe = f.name.replace(/[^a-zA-Z0-9._-]/g, "_").slice(-60);
        const path = `${uid}/${folder}/${Date.now()}-${safe}`;
        const up = await sb.storage.from("store-assets").upload(path, f, { upsert: false, contentType: f.type });
        if (up.error) throw up.error;
        const url = sb.storage.from("store-assets").getPublicUrl(path).data.publicUrl;
        tile.querySelector('input[type="hidden"]').value = url;
        tile.querySelector(".upprev").innerHTML = `<img src="${esc(url)}" alt="" />`;
        tile.querySelector(".upmeta .muted").textContent = "Ketuk untuk ganti gambar";
        err.textContent = "";
      } catch (ex) {
        err.textContent = ex.message || "Gagal mengunggah.";
      }
    });
  });
}

const SHOP_MENU = [
  ["beranda", "Beranda", ""], ["semua", "Semua produk", "semua"], ["kategori", "Kategori", "kategori"],
  ["keranjang", "Keranjang", "keranjang"], ["pesanan", "Pesanan saya", "pesanan"], ["agen", "Agen & distributor", "agen"],
  ["profil", "Profil & ulasan", "profil"], ["kontak", "Kontak", "kontak"],
];
async function ensureShopShell(slug, activeKey) {
  const store = await getStore(slug);
  if (!store) { SHOP_MODE = false; return null; }
  SHOP_MODE = true;
  const count = getCart().filter((i) => i.slug === slug).reduce((a, i) => a + Number(i.qty || 0), 0);
  app.innerHTML = `
    <div class="shop">
      <aside class="side">
        
        ${sideStore(store, store.location || "Toko online")}
        <nav class="sidenav">${SHOP_MENU.map(([k, l, seg]) => `<a href="#/toko/${esc(slug)}${seg ? "/" + seg : ""}" class="navrow ${k === activeKey ? "on" : ""}"><span class="navic">${SHOP_ICON[k] || ""}</span><span class="navtx">${esc(l)}</span>${k === "keranjang" && count ? `<span class="nbadge">${count}</span>` : ""}</a>`).join("")}</nav>

      </aside>
      <section id="shopbody"></section>
    </div>`;
  return store;
}
function shopKey(parts) {
  const seg = parts[2] || "";
  if (!seg) return "beranda";
  if (seg === "produk" || seg === "semua" || seg === "kategori") return seg === "kategori" ? "kategori" : "semua";
  if (seg === "agen" || seg === "distributor") return "agen";
  if (seg === "keranjang" || seg === "checkout") return "keranjang";
  if (seg === "pesanan" || seg === "sukses") return "pesanan";
  if (seg === "profil" || seg === "ulasan") return "profil";
  if (seg === "kontak") return "kontak";
  return "beranda";
}

function unmountChat() { document.querySelectorAll(".chat").forEach((n) => n.remove()); }
function mountChat(slug) {
  unmountChat();
  const box = document.createElement("div");
  box.className = "chat";
  box.innerHTML = `
    <button class="chat-toggle" id="chat-open" type="button">Chat Agen CS</button>
    <div class="chat-panel" id="chat-panel" hidden>
      <div class="chat-head"><b>Dinda · Agen CS</b><button class="chat-x" id="chat-close" type="button">×</button></div>

        <button class="btn small" type="submit">Kirim</button>
      </form>
    </div>`;
  document.body.appendChild(box);
  const panel = box.querySelector("#chat-panel");
  box.querySelector("#chat-open").addEventListener("click", () => { panel.hidden = false; });
  box.querySelector("#chat-close").addEventListener("click", () => { panel.hidden = true; });
  const log = box.querySelector("#chat-log");
  box.querySelector("#chat-form").addEventListener("submit", async (e) => {
    e.preventDefault();

    log.insertAdjacentHTML("beforeend", `<div class="bubble me">${esc(q)}</div>`);
    const wait = document.createElement("div");
    wait.className = "bubble bot"; wait.textContent = "Sedang mengetik…";
    log.appendChild(wait); log.scrollTop = log.scrollHeight;
    try {
      const res = await fetch(`${SUPABASE_URL}/functions/v1/storefront-chat`, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ slug, message: q }),
      });
      const j = await res.json().catch(() => ({}));
      wait.textContent = j.ok ? j.answer : (j.error || "Asisten sedang sibuk. Coba lagi.");
      wait.className = j.ok ? "bubble bot" : "bubble bot err";
    } catch (_) {
      wait.textContent = "Tidak bisa terhubung ke asisten. Coba lagi.";
      wait.className = "bubble bot err";
    }
    log.scrollTop = log.scrollHeight;
  });
}


function productIcon(name) {
  const n = String(name || "").toLowerCase();
  if (/shoe|sepatu|sneaker/.test(n)) return "👟";
  if (/cap|topi/.test(n)) return "🧢";
  if (/shirt|kaos|t-shirt/.test(n)) return "👕";
  if (/wallet|dompet/.test(n)) return "👛";
  if (/backpack|tas/.test(n)) return "🎒";
  if (/sock|kaos kaki/.test(n)) return "🧦";
  return "🛍️";
}

  if (!isAdmin) return setView(`<div class="panel narrow"><h2>Bukan admin</h2><p class="muted">Halaman ini hanya untuk admin platform.</p></div>`);
  setView(`<p class="muted">Memuat data admin…</p>`);
  const [{ data: keys, error: e1 }, { data: accs, error: e2 }] = await Promise.all([
    sb.rpc("admin_list_license_keys"), sb.rpc("admin_list_accounts"),
  ]);
  if (e1 || e2) return setView(`<p class="error">${esc((e1 || e2).message)}</p>`);
  const K = keys || [], A = accs || [];
  const unused = K.filter((k) => k.status === "unused").length;
  const burned = K.filter((k) => k.status !== "unused").length;
  const when = (d) => (d ? new Date(d).toLocaleString("id-ID") : "-");
  setView(`
    <div class="team-head"><div><h1>Panel <span style="color:var(--gold)">admin</span></h1>
      <p class="muted">Kelola kunci lisensi dan akun pemilik toko.</p></div></div>
    <div class="two-col">
      <div class="panel">
        <h2>Buat kunci lisensi</h2>
        <form id="mk">
          <label>Jumlah kunci (1 sampai 100)</label><input name="n" type="number" min="1" max="100" value="5" required />
          <label>Catatan (opsional, mis. nama pembeli)</label><input name="note" />
          <div class="row"><button class="btn" type="submit">Buat kunci</button></div>
        </form>
        <div id="newkeys" style="margin-top:14px">
          ${lastNewKeys.length ? `<p class="ok">Kunci baru:</p><div class="pre">${lastNewKeys.map(esc).join("\n")}</div>` : ""}
        </div>
        <p id="msgmk"></p>
      </div>
      <div class="panel">
        <h2>Ringkasan</h2>
        <div class="line"><span>Kunci belum dipakai</span><b>${unused}</b></div>
        <div class="line"><span>Kunci sudah dipakai</span><b>${burned}</b></div>
        <div class="line"><span>Akun terdaftar</span><b>${A.length}</b></div>
      </div>
    </div>

    <div class="panel" style="margin-top:18px">
      <h2>Daftar kunci lisensi</h2>
      <div style="overflow-x:auto"><table class="tbl">
        <thead><tr><th>Kunci</th><th>Status</th><th>Catatan</th><th>Dipakai oleh</th><th>Toko</th><th>Waktu pakai</th></tr></thead>
        <tbody>${K.map((k) => `<tr>
          <td class="mono">${esc(k.code)}</td>
          <td><span class="tag ${k.status === "unused" ? "ok" : "used"}">${k.status === "unused" ? "belum dipakai" : "hangus"}</span></td>
          <td>${esc(k.note || "-")}</td><td>${esc(k.used_by_email ? k.used_by_email.split("@")[0] : "-")}</td>
          <td>${esc(k.store_name || "-")}</td><td>${when(k.used_at)}</td></tr>`).join("") || `<tr><td colspan="6" class="muted">Belum ada kunci.</td></tr>`}</tbody>
      </table></div>
    </div>

    <div class="panel" style="margin-top:18px">
      <h2>Akun terdaftar</h2>
      <div style="overflow-x:auto"><table class="tbl">
        <thead><tr><th>Username</th><th>Dibuat</th><th>Terakhir masuk</th><th>Toko</th></tr></thead>
        <tbody>${A.map((a) => `<tr>
          <td><b>${esc(a.username)}</b></td><td>${when(a.created_at)}</td><td>${when(a.last_sign_in_at)}</td><td>${esc(a.stores)}</td></tr>`).join("") || `<tr><td colspan="4" class="muted">Belum ada akun.</td></tr>`}</tbody>
      </table></div>
    </div>`);

  document.getElementById("mk").addEventListener("submit", async (e) => {
    e.preventDefault();
    const f = e.target;
    const { data, error } = await sb.rpc("admin_create_license_keys", { p_count: Number(f.n.value), p_note: f.note.value.trim() || null });
    if (error) return toast(error.message, "error");
    lastNewKeys = (data || []).map((r) => (typeof r === "string" ? r : r.admin_create_license_keys));
    renderAdmin();
  });
}

/* ---------- router ---------- */
async function route() {
  updateCartCount();
  unmountChat();
  SHOP_MODE = false;
  const raw = (location.hash || "#/").slice(1);
  const [path, qs] = raw.split("?");
  const q = new URLSearchParams(qs || "");
  const parts = path.split("/").filter(Boolean);
  try {
    if (parts.length === 0) return renderHome();
    if (parts[0] === "tim") return renderTeam();
    if (parts[0] === "daftar") return renderDaftar();
    if (parts[0] === "dashboard") return renderDashboard(parts[1] || "produk");
    if (parts[0] === "admin") return renderAdmin();
    if (parts[0] === "masuk") return renderMasuk();
    if (parts[0] === "keranjang") return renderCart(null);
    if (parts[0] === "toko" && parts[1]) {
      mountChat(parts[1]);
      const sh = await ensureShopShell(parts[1], shopKey(parts));
      if (!sh) return setView(`<div class="panel">Toko tidak ditemukan.</div>`);
      if (parts[2] === "semua" || parts[2] === "produk" && !parts[3]) return renderStoreAll(parts[1], "");
      if (parts[2] === "kategori") return renderStoreAll(parts[1], parts[3] || "");
      if (parts[2] === "profil" || parts[2] === "kontak") return renderStoreProfile(parts[1]);
      const slug = parts[1];
      if (parts.length === 2) return renderStore(slug);
      if (parts[2] === "produk" && parts[3]) return renderProduct(slug, parts[3]);
      if (parts[2] === "keranjang") return renderCart(slug);
      if (parts[2] === "checkout") return renderCheckout(slug);
      if (parts[2] === "sukses") return renderSuccess(slug, q.get("no") || "", q.get("telepon") || "");
      if (parts[2] === "pesanan") return renderOrderStatus(slug, q.get("no") || "", q.get("telepon") || "");
      if (parts[2] === "katalog") return renderCatalog(slug);
      if (parts[2] === "agen") return renderTierPage(slug, "agen");
      if (parts[2] === "distributor") return renderTierPage(slug, "distributor");
    }
    setView(`<div class="panel">Halaman tidak ditemukan. <a href="#/">Kembali</a></div>`);
  } catch (err) {
    setView(`<div class="panel"><p class="error">Terjadi kesalahan: ${esc(err.message || err)}</p><a href="#/">Kembali</a></div>`);
  }
}

window.addEventListener("hashchange", route);
route();

</script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
  }
</script>
</body>
</html>
